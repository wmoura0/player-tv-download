<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JessFlix WebView PoC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #050811;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #videoContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
    }
    /* OSD Overlay */
    .osd {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 40px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.92) 100%);
      pointer-events: none;
      transition: opacity 0.35s ease;
      opacity: 1;
      z-index: 10;
    }
    .osd.hidden {
      opacity: 0;
    }
    .osd-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .title-group h1 {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge-poc {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      background: #E50914;
      color: #FFFFFF;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .attribution {
      font-size: 13px;
      color: #A0A5B5;
    }
    .status-badge {
      font-size: 14px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .status-playing {
      color: #4CAF50;
      border: 1px solid rgba(76, 175, 80, 0.4);
    }
    .status-paused {
      color: #FFC107;
      border: 1px solid rgba(255, 193, 7, 0.4);
    }
    .osd-bottom {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #E50914;
      transition: width 0.2s linear;
    }
    .controls-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .time-display {
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .dpad-hints {
      color: #C0C5D5;
      font-size: 13px;
    }
    .dpad-hints span {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      color: #FFFFFF;
      margin: 0 3px;
    }
    /* Loading Spinner */
    .spinner-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 5;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="videoContainer">
    <video id="pocVideo" preload="auto" playsinline webkit-playsinline>
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Seu reprodutor não suporta a tag de vídeo HTML5.
    </video>

    <div id="spinnerContainer" class="spinner-container">
      <div class="spinner"></div>
      <p style="font-size: 13px; color: #A0A5B5;">Carregando vídeo de teste...</p>
    </div>

    <div id="osd" class="osd">
      <div class="osd-top">
        <div class="title-group">
          <h1>
            <span class="badge-poc">PoC WebView</span>
            <span id="playerTitle">JessFlix WebView Player (Experimental)</span>
          </h1>
          <p class="attribution">
            Vídeo de teste: <strong>Big Buck Bunny</strong> (c) 2008, Blender Foundation | Licença: <em>Creative Commons Attribution 3.0</em>
          </p>
        </div>
        <div id="statusBadge" class="status-badge status-paused">PAUSADO</div>
      </div>

      <div class="osd-bottom">
        <div class="progress-bar-container">
          <div id="progressFill" class="progress-bar-fill"></div>
        </div>
        <div class="controls-info">
          <div id="timeDisplay" class="time-display">00:00 / 00:00</div>
          <div class="dpad-hints">
            Controle Fire TV:
            <span>Centro</span> Play/Pause &bull;
            <span>&larr;</span> -10s &bull;
            <span>&rarr;</span> +10s &bull;
            <span>Voltar</span> Sair
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('pocVideo');
    const osd = document.getElementById('osd');
    const statusBadge = document.getElementById('statusBadge');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressFill = document.getElementById('progressFill');
    const spinner = document.getElementById('spinnerContainer');
    const titleEl = document.getElementById('playerTitle');

    let osdTimeout = null;

    // Tratar parâmetros URL (ex: ?title=...&src=...)
    try {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('title')) {
        titleEl.textContent = urlParams.get('title');
      }
      if (urlParams.has('src')) {
        const customSrc = urlParams.get('src');
        if (customSrc && customSrc.startsWith('http')) {
          video.src = customSrc;
        }
      }
    } catch (_) {}

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      const mStr = m < 10 ? "0" + m : m;
      const sStr = s < 10 ? "0" + s : s;
      return mStr + ":" + sStr;
    }

    function showOsd() {
      osd.classList.remove('hidden');
      if (osdTimeout) clearTimeout(osdTimeout);
      if (!video.paused) {
        osdTimeout = setTimeout(() => {
          osd.classList.add('hidden');
        }, 3500);
      }
    }

    // Eventos nativos HTML5 Video
    video.addEventListener('loadstart', () => {
      spinner.style.display = 'flex';
      showOsd();
    });

    video.addEventListener('canplay', () => {
      spinner.style.display = 'none';
    });

    video.addEventListener('waiting', () => {
      spinner.style.display = 'flex';
    });

    video.addEventListener('playing', () => {
      spinner.style.display = 'none';
      statusBadge.textContent = "REPRODUZINDO";
      statusBadge.className = "status-badge status-playing";
      showOsd();
      if (window.JessFlixBridge && window.JessFlixBridge.onPlay) {
        window.JessFlixBridge.onPlay();
      }
    });

    video.addEventListener('pause', () => {
      statusBadge.textContent = "PAUSADO";
      statusBadge.className = "status-badge status-paused";
      showOsd();
      if (window.JessFlixBridge && window.JessFlixBridge.onPause) {
        window.JessFlixBridge.onPause();
      }
    });

    video.addEventListener('timeupdate', () => {
      const current = video.currentTime;
      const duration = video.duration || 0;
      timeDisplay.textContent = formatTime(current) + " / " + formatTime(duration);
      if (duration > 0) {
        progressFill.style.width = ((current / duration) * 100) + "%";
      }
      if (window.JessFlixBridge && window.JessFlixBridge.onTimeUpdate) {
        window.JessFlixBridge.onTimeUpdate(current, duration);
      }
    });

    video.addEventListener('ended', () => {
      statusBadge.textContent = "CONCLUÍDO";
      statusBadge.className = "status-badge status-paused";
      showOsd();
      if (window.JessFlixBridge && window.JessFlixBridge.onEnded) {
        window.JessFlixBridge.onEnded();
      }
    });

    video.addEventListener('error', (e) => {
      spinner.style.display = 'none';
      statusBadge.textContent = "ERRO DE MÍDIA";
      statusBadge.className = "status-badge status-paused";
      showOsd();
      const err = video.error ? video.error.message : "Erro desconhecido";
      if (window.JessFlixBridge && window.JessFlixBridge.onError) {
        window.JessFlixBridge.onError(err);
      }
    });

    // API pública exposta para o Android via evaluateJavascript
    window.togglePlay = function() {
      if (video.paused) {
        video.play().catch(e => console.log('Play blocked', e));
      } else {
        video.pause();
      }
      showOsd();
    };

    window.seekBy = function(seconds) {
      const cur = video.currentTime;
      const dur = video.duration || 0;
      video.currentTime = Math.max(0, Math.min(dur, cur + seconds));
      showOsd();
    };

    window.showOsd = showOsd;

    // Autoplay automático com tratamento de promessa
    document.addEventListener('DOMContentLoaded', () => {
      showOsd();
      video.play().catch(() => {
        // Se o navegador exigir interação, fica em pausa
        video.pause();
      });
    });
  </script>
</body>
</html>
